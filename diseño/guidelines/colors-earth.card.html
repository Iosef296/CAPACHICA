<!-- @dsCard group="Colors" viewport="700x200" name="Earth · Alpaca · Night" subtitle="Deep earth backgrounds, alpaca cream text, night darks" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg); margin: 0; padding: 20px; font-family: var(--font-ui); display: flex; flex-direction: column; gap: 12px; }
  .group { display: flex; gap: 0; border-radius: 6px; overflow: hidden; }
  .sw { flex: 1; height: 44px; display: flex; align-items: flex-end; padding: 4px 6px; }
  .sw span { font-size: 8px; color: rgba(255,255,255,0.65); letter-spacing: 0.06em; }
  .label { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
</style>
</head><body>
<div>
  <div class="label">Alpaca / Cream Text</div>
  <div class="group">
    <div class="sw" style="background:#FAF6F0"><span style="color:#100806">50</span></div>
    <div class="sw" style="background:#F5EDD8"><span style="color:#100806">100★</span></div>
    <div class="sw" style="background:#EAD5B0"><span style="color:#100806">200</span></div>
    <div class="sw" style="background:#D8BC88"><span style="color:#100806">300</span></div>
    <div class="sw" style="background:#C4A068"><span>400</span></div>
    <div class="sw" style="background:#A88048"><span>500</span></div>
  </div>
</div>
<div>
  <div class="label">Tierra / Earth</div>
  <div class="group">
    <div class="sw" style="background:#C4A880"><span style="color:#120804">100</span></div>
    <div class="sw" style="background:#8B6445"><span>300</span></div>
    <div class="sw" style="background:#70482C"><span>400</span></div>
    <div class="sw" style="background:#5C3418"><span>500</span></div>
    <div class="sw" style="background:#42220A"><span>600</span></div>
    <div class="sw" style="background:#2E1306"><span>700</span></div>
    <div class="sw" style="background:#1E0C04"><span>800</span></div>
  </div>
</div>
<div>
  <div class="label">Night Backgrounds</div>
  <div class="group">
    <div class="sw" style="background:#4A2810"><span>400</span></div>
    <div class="sw" style="background:#3A1E0C"><span>500</span></div>
    <div class="sw" style="background:#2C160A"><span>600</span></div>
    <div class="sw" style="background:#201008"><span>700</span></div>
    <div class="sw" style="background:#180C06"><span>800</span></div>
    <div class="sw" style="background:#100806;border:1px solid rgba(255,255,255,0.08)"><span>900★</span></div>
  </div>
</div>
</body></html>
