<!-- @dsCard group="Colors" viewport="700x180" name="Clay · Arcilla" subtitle="Primary action color — terracotta earth of the Andes" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg); margin: 0; padding: 20px; font-family: var(--font-ui); }
  .row { display: flex; gap: 6px; align-items: flex-end; }
  .swatch { flex: 1; border-radius: 4px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; }
  .swatch span { font-size: 9px; letter-spacing: 0.08em; opacity: 0.75; color: #fff; }
  .swatch small { font-size: 9px; color: rgba(255,255,255,0.55); }
  .label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
</style>
</head><body>
<div class="label">Arcilla / Clay — Primary</div>
<div class="row">
  <div class="swatch" style="background:#FDF0E8;height:60px"><span style="color:#3A1004">50</span><small style="color:#3A100455">#FDF0E8</small></div>
  <div class="swatch" style="background:#F8D5BA;height:70px"><span style="color:#3A1004">100</span></div>
  <div class="swatch" style="background:#EEB080;height:80px"><span style="color:#3A1004">200</span></div>
  <div class="swatch" style="background:#DE8649;height:90px"><span>300</span></div>
  <div class="swatch" style="background:#C96832;height:100px"><span>400</span></div>
  <div class="swatch" style="background:#B8531F;height:110px;outline:2px solid #f0c96a;outline-offset:2px"><span>500 ★</span><small>#B8531F</small></div>
  <div class="swatch" style="background:#9A3F14;height:100px"><span>600</span></div>
  <div class="swatch" style="background:#7C2D0C;height:90px"><span>700</span></div>
  <div class="swatch" style="background:#5C1E08;height:80px"><span>800</span></div>
  <div class="swatch" style="background:#3A1004;height:70px"><span>900</span></div>
</div>
</body></html>
