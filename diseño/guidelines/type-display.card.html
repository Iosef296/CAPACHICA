<!-- @dsCard group="Type" viewport="700x260" name="Display & Headings" subtitle="Playfair Display — used for all headings and hero text" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg); margin: 0; padding: 24px 28px; color: var(--text); }
  .line { margin-bottom: 12px; }
  .size { font-size: 9px; font-family: var(--font-ui); color: var(--text-3); letter-spacing: 0.12em; text-transform: uppercase; display: block; margin-bottom: 2px; }
</style>
</head><body>
<div class="line"><span class="size">hero — clamp(3rem,8vw,6.5rem)</span>
  <div style="font-family:var(--font-display);font-size:clamp(2.8rem,7vw,5.5rem);line-height:1.05;font-weight:800;color:var(--alpaca-100)">Capachica</div>
</div>
<div class="line"><span class="size">display italic — 3xl / 700</span>
  <div style="font-family:var(--font-display);font-size:2rem;font-style:italic;font-weight:700;color:var(--warm)">La joya del Titicaca</div>
</div>
<div class="line"><span class="size">section — 2xl / 700</span>
  <div style="font-family:var(--font-display);font-size:1.7rem;font-weight:700;color:var(--alpaca-100)">Destinos imperdibles</div>
</div>
<div class="line"><span class="size">card title — xl / 600</span>
  <div style="font-family:var(--font-display);font-size:1.2rem;font-weight:600;color:var(--alpaca-200)">Playa Llachón</div>
</div>
<div style="font-size:9px;font-family:var(--font-ui);color:var(--text-3);margin-top:8px;letter-spacing:0.05em">Font: Playfair Display · Weights: 400, 600, 700, 800 · Italic: 400i, 600i</div>
</body></html>
