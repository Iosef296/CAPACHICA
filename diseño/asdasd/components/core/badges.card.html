<!-- @dsCard group="Components" viewport="700x220" name="Badges · Tags · Labels" subtitle="Status badges, filter tags, and section eyebrow labels" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{background:var(--bg);margin:0;padding:20px 24px;font-family:var(--font-ui);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .lbl{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-3);width:90px;flex-shrink:0;}
  hr{border:none;border-top:1px solid var(--border);margin:4px 0 12px;}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Badge, Tag, SectionLabel } = window.CapachicaDesignSystem_756025;
function App() {
  const [active, setActive] = React.useState('vivencial');
  return (
    <div>
      <div className="row">
        <span className="lbl">Badges</span>
        <Badge variant="clay" dot>Arcilla</Badge>
        <Badge variant="gold" dot>Oro</Badge>
        <Badge variant="lake">Titicaca</Badge>
        <Badge variant="reed">Totora</Badge>
        <Badge variant="neutral">Neutro</Badge>
        <Badge variant="danger">Error</Badge>
      </div>
      <div className="row">
        <span className="lbl">Sizes</span>
        <Badge variant="clay" size="xs">XS</Badge>
        <Badge variant="clay" size="sm">SM</Badge>
        <Badge variant="clay" size="lg">LG</Badge>
      </div>
      <hr/>
      <div className="row">
        <span className="lbl">Tags</span>
        {['Vivencial','Kayak','Gastronomía','Festividades','Artesanía'].map(t => (
          <Tag key={t} active={active===t.toLowerCase()} onClick={()=>setActive(t.toLowerCase())} color="#B8531F">{t}</Tag>
        ))}
      </div>
      <hr/>
      <div className="row">
        <span className="lbl">Labels</span>
        <SectionLabel color="warm">La Joya del Titicaca</SectionLabel>
        <SectionLabel color="clay" icon="◆">Destinos</SectionLabel>
        <SectionLabel color="lake" icon="~">Lago</SectionLabel>
        <SectionLabel color="reed" icon="❧">Naturaleza</SectionLabel>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
