<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg);margin:0;padding:20px 24px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Card } = window.CapachicaDesignSystem_756025;
function App() {
  return (
    <div className="grid">
      <Card
        icon="🏖️" subtitle="La única playa" title="Playa Llachón"
        description="Arena blanca a 3,820 msnm. Un milagro geológico en el corazón del altiplano."
        color="#2A74B8" href="/destinos" tags={["Playa","Kayak","Amanecer"]}
      />
      <Card
        icon="🎊" subtitle="Festividades" title="Virgen Candelaria"
        description="La fiesta más colorida del altiplano. Danzas, trajes y música ancestral."
        color="#B8531F" href="/festividades" tags={["Danza","Tradición","Febrero"]}
      />
      <Card
        icon="🧶" subtitle="Artesanía" title="Tejidos Ancestrales"
        description="Aguayos y chullos tejidos con técnicas quechuas de más de 500 años."
        color="#C9903A" href="/artesania" tags={["Aguayo","Alpaca","Lana"]}
      />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
