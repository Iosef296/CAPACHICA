<!-- @dsCard group="Brand" viewport="700x200" name="Brand Overview" subtitle="Capachica Turismo — rustic Andean identity system" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg); margin: 0; padding: 24px 28px; font-family: var(--font-ui); color: var(--text); display: flex; gap: 28px; align-items: flex-start; }
  .logo { width: 64px; height: 64px; border-radius: 6px; background: linear-gradient(135deg, #B8531F, #7C2D0C); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 32px; font-weight: 800; color: #F5EDD8; flex-shrink: 0; box-shadow: 0 4px 20px rgba(184,83,31,0.4); }
  .palette { display: flex; gap: 4px; margin-top: 10px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; }
  h1 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; margin: 0 0 2px; }
  .tag { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--warm); }
  .weave { height: 4px; margin: 10px 0; background: repeating-linear-gradient(90deg,#B8531F 0,#B8531F 4px,#C9903A 4px,#C9903A 8px,#7C2D0C 8px,#7C2D0C 12px,#C9903A 12px,#C9903A 16px,#5A8E20 16px,#5A8E20 20px,#C9903A 20px,#C9903A 24px); }
  .facts { font-size: 11px; color: var(--text-3); line-height: 1.7; }
  .facts strong { color: var(--text-2); }
</style>
</head><body>
<div class="logo">C</div>
<div style="flex:1">
  <div class="tag">Capachica Turismo · Puno, Perú</div>
  <h1>Capachica</h1>
  <div class="weave"></div>
  <div class="facts">
    <strong>Palette:</strong> Arcilla · Oro Andino · Titicaca · Totora · Alpaca<br>
    <strong>Fonts:</strong> Playfair Display (display) · Lora (body) · Josefin Sans (UI)<br>
    <strong>Radius:</strong> 6px default — angular, organic, not pill-shaped<br>
    <strong>Vibe:</strong> Rural Andean · Earthy · Handcrafted · Authentic community tourism
  </div>
  <div class="palette" style="margin-top:10px">
    <div class="dot" style="background:#B8531F" title="Clay"></div>
    <div class="dot" style="background:#C9903A" title="Gold"></div>
    <div class="dot" style="background:#2A74B8" title="Lake"></div>
    <div class="dot" style="background:#5A8E20" title="Reed"></div>
    <div class="dot" style="background:#F5EDD8" title="Alpaca"></div>
    <div class="dot" style="background:#100806" title="Night"></div>
  </div>
</div>
</body></html>
