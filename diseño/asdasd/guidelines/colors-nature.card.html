<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>

  .label { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
</style>
</head><body>
<div>
  <div class="label">Oro Andino / Gold</div>

    <div class="sw" style="background:#EDD898"><span style="color:#6A4810">200</span></div>
    <div class="sw" style="background:#DEB85A"><span style="color:#6A4810">300</span></div>
    <div class="sw" style="background:#C9903A"><span>400★</span></div>
    <div class="sw" style="background:#B07828"><span>500</span></div>
    <div class="sw" style="background:#8C601A"><span>600</span></div>
    <div class="sw" style="background:#6A4810"><span>700</span></div>
  </div>
</div>
<div>
  <div class="label">Titicaca / Lake Blue</div>

    <div class="sw" style="background:#C8DFF5"><span style="color:#0E3060">100</span></div>
    <div class="sw" style="background:#8BBCE8"><span style="color:#0E3060">200</span></div>

    <div class="sw" style="background:#2A74B8"><span>400★</span></div>
    <div class="sw" style="background:#1E5A9C"><span>500</span></div>
    <div class="sw" style="background:#154480"><span>600</span></div>
    <div class="sw" style="background:#0E3060"><span>700</span></div>
  </div>
</div>
<div>
  <div class="label">Totora / Reed Green</div>
  <div class="group">
    <div class="sw" style="background:#D4E8B0"><span style="color:#183008">100</span></div>
