<!-- @dsCard group="App Móvil" viewport="900x720" name="App Móvil — Capachica" subtitle="Pantallas principales de la app con diseño rústico andino" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capachica App Móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&family=Lora:wght@400;500;600&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1A0C06; font-family: 'Josefin Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; gap: 32px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── Design tokens ── */
const C = {
  clay:    '#B8531F', clayLight: '#DE8649', clayDark: '#7C2D0C',
  gold:    '#C9903A', goldLight: '#DEB85A',
  lake:    '#2A74B8', lakeLight: '#5096D4',
  reed:    '#5A8E20', reedLight: '#7AAF38',
  night:   '#100806', night2: '#180C06', night3: '#201008',
  surface: 'rgba(26,10,4,0.92)',
  text:    '#F5EDD8', text2: 'rgba(245,237,216,0.70)', text3: 'rgba(245,237,216,0.42)',
  border:  'rgba(184,83,31,0.24)', borderWarm: 'rgba(201,144,58,0.32)',
};

const display  = "'Playfair Display', serif";
const body     = "'Lora', serif";
const ui       = "'Josefin Sans', sans-serif";

/* ── Phone Frame ── */
function Phone({ children, title = 'Capachica', screen }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:8 }}>
      <div style={{ fontFamily:ui, fontSize:10, letterSpacing:'0.16em', textTransform:'uppercase', color:'rgba(245,237,216,0.38)', marginBottom:2 }}>{screen}</div>
      <div style={{
        width: 320, height: 620, borderRadius: 36,
        background: C.night,
        border: `2px solid rgba(255,255,255,0.12)`,
        boxShadow: '0 24px 64px rgba(0,0,0,0.70), inset 0 1px 0 rgba(255,255,255,0.08)',
        overflow: 'hidden', position: 'relative', flexShrink: 0,
      }}>
        {/* Status bar */}
        <div style={{ height:32, background:C.night, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 20px', flexShrink:0 }}>
          <span style={{ fontFamily:ui, fontSize:11, fontWeight:600, color:C.text }}>9:41</span>
          <div style={{ display:'flex', gap:6, alignItems:'center' }}>
            <span style={{ fontSize:10, color:C.text }}>●●●</span>
            <span style={{ fontSize:10, color:C.text }}>WiFi</span>
            <span style={{ fontSize:10, color:C.text }}>🔋</span>
          </div>
        </div>
        {/* Screen content */}
        <div style={{ height:'calc(100% - 32px - 56px)', overflowY:'auto', overflowX:'hidden' }}>
          {children}
        </div>
        {/* Bottom nav */}
        <BottomNav active={screen} />
      </div>
    </div>
  );
}

function BottomNav({ active }) {
  const tabs = [
    { id:'Inicio', icon:'⌂', label:'Inicio' },
    { id:'Destinos', icon:'◎', label:'Destinos' },
    { id:'Reservar', icon:'✦', label:'Reservar' },
    { id:'Perfil', icon:'○', label:'Perfil' },
  ];
  return (
    <div style={{ height:56, background:'rgba(16,8,4,0.98)', borderTop:`1px solid ${C.border}`, display:'flex', alignItems:'stretch' }}>
      {tabs.map(t => {
        const on = active === t.id;
        return (
          <div key={t.id} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2, cursor:'pointer' }}>
            <span style={{ fontSize:16, color: on ? C.clay : C.text3 }}>{t.icon}</span>
            <span style={{ fontFamily:ui, fontSize:9, fontWeight:600, letterSpacing:'0.08em', textTransform:'uppercase', color: on ? C.clay : C.text3 }}>{t.label}</span>
            {on && <div style={{ position:'absolute', bottom:52, width:20, height:2, background:C.clay, borderRadius:1 }}/>}
          </div>
        );
      })}
    </div>
  );
}

/* ── Weave stripe ── */
const weave = { height:4, background:'repeating-linear-gradient(90deg,#B8531F 0,#B8531F 4px,#C9903A 4px,#C9903A 8px,#7C2D0C 8px,#7C2D0C 12px,#C9903A 12px,#C9903A 16px,#5A8E20 16px,#5A8E20 20px,#C9903A 20px,#C9903A 24px)' };

/* ══════════════════════
 * SCREEN 1: Home
 * ══════════════════════ */
function HomeScreen() {
  return (
    <div style={{ background:C.night, minHeight:'100%' }}>
      {/* Hero */}
      <div style={{ position:'relative', height:200, background:`linear-gradient(180deg, #0C0604 0%, #1A0A04 60%, #201008 100%)`, overflow:'hidden' }}>
        {/* Stars */}
        {[...Array(20)].map((_,i) => (
          <div key={i} style={{ position:'absolute', width:i%3===0?2:1, height:i%3===0?2:1, borderRadius:'50%', background:'rgba(245,220,160,0.7)', top:`${Math.sin(i*7.3)*35+20}%`, left:`${(i*13.7)%90+5}%` }}/>
        ))}
        {/* Mountain silhouette */}
        <svg style={{ position:'absolute', bottom:0, left:0, width:'100%' }} viewBox="0 0 320 70" preserveAspectRatio="none">
          <path d="M0,70 L0,50 L30,38 L60,48 L90,32 L120,44 L155,20 L190,38 L220,28 L255,42 L285,30 L320,38 L320,70 Z" fill="#1C0C06"/>
          <path d="M0,70 L0,60 L40,52 L70,58 L105,48 L135,55 L165,44 L195,52 L230,45 L265,52 L295,46 L320,50 L320,70 Z" fill="#100806"/>
        </svg>
        {/* Header content */}
        <div style={{ position:'relative', zIndex:2, padding:'12px 18px' }}>
          <div style={{ fontFamily:ui, fontSize:9, letterSpacing:'0.18em', textTransform:'uppercase', color:C.gold, marginBottom:4 }}>✦ Bienvenido</div>
          <div style={{ fontFamily:display, fontSize:22, fontWeight:800, color:C.text, lineHeight:1.1 }}>Capachica</div>
          <div style={{ fontFamily:display, fontSize:13, fontStyle:'italic', color:C.gold }}>La Joya del Titicaca</div>
        </div>
        <div style={{ ...weave, position:'absolute', bottom:0, left:0, right:0, zIndex:3 }}/>
      </div>

      {/* Quick nav */}
      <div style={{ display:'flex', gap:8, padding:'12px 14px', overflowX:'auto' }}>
        {[['🏠','Vivencial','#B8531F'],['🚣','Kayak','#5A8E20'],['🍽️','Gastro','#C9903A'],['🎊','Fiestas','#2A74B8'],['🧶','Arte','#B8531F']].map(([icon,label,color]) => (
          <div key={label} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, cursor:'pointer', flexShrink:0 }}>
            <div style={{ width:44, height:44, borderRadius:8, background:`rgba(${color==='#B8531F'?'184,83,31':color==='#5A8E20'?'90,142,32':color==='#C9903A'?'201,144,58':color==='#2A74B8'?'42,116,184':'184,83,31'},0.16)`, border:`1px solid rgba(${color==='#B8531F'?'184,83,31':color==='#5A8E20'?'90,142,32':color==='#C9903A'?'201,144,58':color==='#2A74B8'?'42,116,184':'184,83,31'},0.35)`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:20 }}>{icon}</div>
            <span style={{ fontFamily:ui, fontSize:9, letterSpacing:'0.06em', color:C.text3, textTransform:'uppercase' }}>{label}</span>
          </div>
        ))}
      </div>

      {/* Stats row */}
      <div style={{ display:'flex', margin:'0 14px 12px', background:'rgba(26,10,4,0.80)', border:`1px solid ${C.border}`, borderRadius:6 }}>
        {[['3,820','msnm'],['8+','comunidades'],['500+','años']].map(([val,lbl],i) => (
          <div key={lbl} style={{ flex:1, textAlign:'center', padding:'8px 4px', borderRight: i<2 ? `1px solid ${C.border}` : 'none' }}>
            <div style={{ fontFamily:display, fontSize:16, fontWeight:700, color:C.gold }}>{val}</div>
            <div style={{ fontFamily:ui, fontSize:8, letterSpacing:'0.10em', color:C.text3, textTransform:'uppercase', marginTop:2 }}>{lbl}</div>
          </div>
        ))}
      </div>

      {/* Section: Destinos */}
      <div style={{ padding:'0 14px 8px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
          <div style={{ fontFamily:display, fontSize:15, fontWeight:700, color:C.text }}>Destinos cercanos</div>
          <span style={{ fontFamily:ui, fontSize:9, color:C.clay, letterSpacing:'0.08em', textTransform:'uppercase' }}>Ver todos →</span>
        </div>
        {[['🏖️','Playa Llachón','La única playa del Titicaca',C.lake],['🏔️','Mirador Amaru','360° del lago',C.gold]].map(([icon,name,sub,color]) => (
          <div key={name} style={{ display:'flex', gap:10, background:'rgba(26,10,4,0.80)', border:`1px solid ${C.border}`, borderRadius:6, padding:'10px 12px', marginBottom:8, cursor:'pointer' }}>
            <div style={{ width:40, height:40, borderRadius:6, background:`rgba(${color===C.lake?'42,116,184':'201,144,58'},0.18)`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0 }}>{icon}</div>
            <div>
              <div style={{ fontFamily:display, fontSize:13, fontWeight:700, color:C.text, lineHeight:1.2 }}>{name}</div>
              <div style={{ fontFamily:body, fontSize:11, color:C.text3, marginTop:2 }}>{sub}</div>
            </div>
            <span style={{ marginLeft:'auto', color:C.text3, fontSize:14, alignSelf:'center' }}>›</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ══════════════════════
 * SCREEN 2: Destinos
 * ══════════════════════ */
function DestinosScreen() {
  const [active, setActive] = React.useState('todos');
  const filters = ['Todos','Playa','Isla','Mirador','Pueblo'];
  const destinos = [
    { icon:'🏖️', name:'Playa Llachón', sub:'La única playa del Titicaca', color:C.lake, tags:['Playa','Kayak'] },
    { icon:'🏝️', name:'Isla Ticonata', sub:'Isla sagrada de totora', color:C.reed, tags:['Isla','Bote'] },
    { icon:'🏔️', name:'Mirador Amaru', sub:'360° del Lago Titicaca', color:C.gold, tags:['Mirador','Foto'] },
    { icon:'🏘️', name:'Comunidad Capachica', sub:'Corazón de la península', color:C.clay, tags:['Pueblo','Artesanía'] },
  ];
  return (
    <div style={{ background:C.night, minHeight:'100%' }}>
      {/* Header */}
      <div style={{ padding:'14px 16px 10px', background:C.night2, borderBottom:`1px solid ${C.border}` }}>
        <div style={{ fontFamily:ui, fontSize:9, letterSpacing:'0.18em', textTransform:'uppercase', color:C.gold, marginBottom:4 }}>◆ Explorar</div>
        <div style={{ fontFamily:display, fontSize:20, fontWeight:800, color:C.text }}>Destinos</div>
      </div>
      {/* Filter chips */}
      <div style={{ display:'flex', gap:6, padding:'10px 14px', overflowX:'auto' }}>
        {filters.map(f => {
          const on = active===f.toLowerCase();
          return (
            <div key={f} onClick={()=>setActive(f.toLowerCase())} style={{ padding:'5px 12px', borderRadius:4, background: on?'rgba(184,83,31,0.20)':'rgba(255,255,255,0.06)', border:`1px solid ${on?'rgba(184,83,31,0.55)':'rgba(255,255,255,0.12)'}`, fontFamily:ui, fontSize:10, fontWeight:600, letterSpacing:'0.06em', color: on?C.clayLight:C.text3, cursor:'pointer', flexShrink:0, textTransform:'uppercase' }}>{f}</div>
          );
        })}
      </div>
      {/* Cards */}
      <div style={{ padding:'4px 14px 14px', display:'flex', flexDirection:'column', gap:10 }}>
        {destinos.map(d => {
          const rgb = d.color===C.lake?'42,116,184':d.color===C.reed?'90,142,32':d.color===C.gold?'201,144,58':'184,83,31';
          return (
            <div key={d.name} style={{ background:'rgba(26,10,4,0.85)', border:`1px solid rgba(${rgb},0.24)`, borderRadius:6, padding:'12px 14px', cursor:'pointer', position:'relative', overflow:'hidden' }}>
              <div style={{ position:'absolute', top:-20, right:-20, width:70, height:70, borderRadius:'50%', background:`radial-gradient(circle,rgba(${rgb},0.16) 0%,transparent 70%)`, pointerEvents:'none' }}/>
              <div style={{ display:'flex', gap:10, alignItems:'flex-start' }}>
                <div style={{ width:44, height:44, borderRadius:6, background:`rgba(${rgb},0.16)`, border:`1px solid rgba(${rgb},0.30)`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, flexShrink:0 }}>{d.icon}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontFamily:display, fontSize:14, fontWeight:700, color:C.text, lineHeight:1.2, marginBottom:3 }}>{d.name}</div>
                  <div style={{ fontFamily:body, fontSize:11, color:C.text3, marginBottom:6 }}>{d.sub}</div>
                  <div style={{ display:'flex', gap:4 }}>
                    {d.tags.map(t=>(
                      <span key={t} style={{ padding:'2px 7px', borderRadius:3, background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.10)', fontFamily:ui, fontSize:9, color:C.text3, textTransform:'uppercase', letterSpacing:'0.06em' }}>{t}</span>
                    ))}
                  </div>
                </div>
                <span style={{ color:C.text3, fontSize:16, alignSelf:'center', flexShrink:0 }}>›</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════════════════
 * SCREEN 3: Reservar
 * ══════════════════════ */
function ReservarScreen() {
  const [step, setStep] = React.useState(0);
  const experiencias = [
    { icon:'🏠', name:'Turismo Vivencial', price:'S/. 120', tag:'2 días', color:'#B8531F' },
    { icon:'🚣', name:'Kayak al Amanecer', price:'S/. 45', tag:'4 horas', color:'#5A8E20' },
    { icon:'🍽️', name:'Cocina Andina', price:'S/. 35', tag:'3 horas', color:'#C9903A' },
  ];
  return (
    <div style={{ background:C.night, minHeight:'100%' }}>
      {/* Header */}
      <div style={{ padding:'14px 16px 10px', background:C.night2, borderBottom:`1px solid ${C.border}` }}>
        <div style={{ fontFamily:ui, fontSize:9, letterSpacing:'0.18em', textTransform:'uppercase', color:C.gold, marginBottom:4 }}>✦ Planifica</div>
        <div style={{ fontFamily:display, fontSize:20, fontWeight:800, color:C.text }}>Reservar</div>
      </div>

      {/* Step indicator */}
      <div style={{ display:'flex', gap:0, padding:'10px 16px' }}>
        {['Elegir','Fecha','Confirmar'].map((s,i)=>(
          <div key={s} style={{ display:'flex', alignItems:'center', flex:1 }}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
              <div style={{ width:24, height:24, borderRadius:4, background: i<=step?C.clay:'rgba(255,255,255,0.08)', border:`1px solid ${i<=step?C.clay:'rgba(255,255,255,0.14)'}`, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:ui, fontSize:10, fontWeight:700, color: i<=step?'#F5EDD8':C.text3 }}>{i+1}</div>
              <span style={{ fontFamily:ui, fontSize:8, letterSpacing:'0.06em', textTransform:'uppercase', color: i<=step?C.clayLight:C.text3 }}>{s}</span>
            </div>
            {i<2 && <div style={{ flex:1, height:1, background: i<step?C.clay:C.border, margin:'0 4px', marginBottom:14 }}/>}
          </div>
        ))}
      </div>

      {/* Experience list */}
      <div style={{ padding:'4px 14px' }}>
        <div style={{ fontFamily:ui, fontSize:9, letterSpacing:'0.14em', textTransform:'uppercase', color:C.text3, marginBottom:8 }}>Elige una experiencia</div>
        {experiencias.map((e,i) => {
          const rgb = e.color==='#B8531F'?'184,83,31':e.color==='#5A8E20'?'90,142,32':'201,144,58';
          const sel = step===1 && i===0;
          return (
            <div key={e.name} onClick={()=>setStep(1)} style={{ display:'flex', alignItems:'center', gap:10, background: sel?`rgba(${rgb},0.14)`:'rgba(26,10,4,0.80)', border:`1px solid rgba(${rgb},${sel?'0.50':'0.22'})`, borderRadius:6, padding:'10px 12px', marginBottom:8, cursor:'pointer' }}>
              <div style={{ width:40, height:40, borderRadius:6, background:`rgba(${rgb},0.18)`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0 }}>{e.icon}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:display, fontSize:13, fontWeight:700, color:C.text }}>{e.name}</div>
                <div style={{ fontFamily:ui, fontSize:10, color:C.text3, marginTop:2 }}>{e.tag}</div>
              </div>
              <div style={{ fontFamily:display, fontSize:14, fontWeight:700, color:e.color }}>{e.price}</div>
            </div>
          );
        })}
      </div>

      {/* CTA */}
      <div style={{ padding:'8px 14px 14px' }}>
        <div onClick={()=>setStep(s=>Math.min(s+1,2))} style={{ background:`linear-gradient(135deg,${C.clay},${C.clayDark})`, borderRadius:6, padding:'13px', textAlign:'center', cursor:'pointer', boxShadow:'0 4px 18px rgba(184,83,31,0.38)' }}>
          <span style={{ fontFamily:ui, fontSize:12, fontWeight:700, letterSpacing:'0.10em', textTransform:'uppercase', color:'#F5EDD8' }}>
            {step===2 ? '✓ Confirmado' : 'Continuar →'}
          </span>
        </div>
      </div>
    </div>
  );
}

/* ── Main App ── */
function App() {
  return (
    <div style={{ display:'flex', gap:24, alignItems:'flex-start', flexWrap:'wrap', justifyContent:'center' }}>
      <Phone title="Capachica" screen="Inicio"><HomeScreen/></Phone>
      <Phone title="Capachica" screen="Destinos"><DestinosScreen/></Phone>
      <Phone title="Capachica" screen="Reservar"><ReservarScreen/></Phone>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
