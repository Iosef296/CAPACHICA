<script>
        // Micro-interaction: Select Point logic
        function selectPoint(locationName) {
            const card = document.getElementById('preview-card');
            
            // Subtle feedback: hide and show with new data
            card.classList.add('opacity-0', 'translate-y-4');
            
            setTimeout(() => {
                // In a real app, data would update here
                const title = card.querySelector('h3');
                const locText = card.querySelector('p');
                
                if(locationName === 'Llachón') {
                    title.innerText = 'Lodge Tradicional Munay';
                    locText.innerHTML = `<span class="material-symbols-outlined text-[14px]">location_on</span>Llachón Community`;
                } else if (locationName === 'Ccotos') {
                    title.innerText = 'Hospedaje Familiar Samary';
                    locText.innerHTML = `<span class="material-symbols-outlined text-[14px]">location_on</span>Ccotos Community`;
                } else if (locationName === 'Chifrón') {
                    title.innerText = 'Mirador del Lago Chifrón';
                    locText.innerHTML = `<span class="material-symbols-outlined text-[14px]">location_on</span>Chifrón Beach`;
                } else {
                    title.innerText = 'Yapura Artisans House';
                    locText.innerHTML = `<span class="material-symbols-outlined text-[14px]">location_on</span>Yapura Pier`;
                }
                
                card.classList.remove('opacity-0', 'translate-y-4');
            }, 300);
        }

        // Category filtering interaction
        const filterBtns = document.querySelectorAll('.glass-panel.rounded-full');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active-filter', 'text-white'));
                filterBtns.forEach(b => b.classList.add('text-on-surface-variant'));
                btn.classList.add('active-filter');
                btn.classList.remove('text-on-surface-variant');
            });
        });
    </script>
