<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(157, 67, 32, 0.1);
        }
        .marker-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(1.1); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .custom-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Google Maps Style Styling */
        .map-bg {
            background-color: #f8f9fa;
        }
        .map-water {
            background-color: #aad3df;
        }
        .map-land {
            background-color: #f1eee8;
        }
        .map-park {
            background-color: #d1f2d1;
        }
        .map-road {
            background-color: #ffffff;
            box-shadow: 0 0 1px rgba(0,0,0,0.1);
        }
    </style>

                        "tertiary-fixed-dim": "#ffb2be",

<style>
        body {
            min-height: max(884px, 100dvh);
        }

</head>
<body class="bg-background text-on-surface font-body-md overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface/70 backdrop-blur-xl flex justify-between items-center px-container-padding py-base w-full sticky top-0 z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary/20">
<img class="w-full h-full object-cover" data-alt="A close-up high-resolution portrait of a smiling Andean woman traveler" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZHGNwJlxFRa9irIKFxMbDFnYtqPHtZL5gc28xRdbPZhQDRHVje7CQmeuaWX-H2_vLbCFd0u1yABGKD6OhrzUn2iw0rD5zd-T7T3Uz0cJbX0nrnP5i9svPRC4dfB31jMPAjiSjNXIIrTrFDJWY0r9ZbV9Vw1sq6Sgt5MQJdFapJvtlc38_L7HNcCFWOZLouOGQ4k6QBTxj0c-zmxUJ_ArWov3Xuld9vxf8QG5ht2hAzWSRjf8WY6_ycvtqDYerVqnzSLfI4uKUsbI"/>

</div>
<button class="w-10 h-10 flex items-center justify-center text-primary hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>

</header>
<main class="relative h-[calc(100vh-140px)] w-full overflow-hidden bg-surface-container-low">
<!-- Google Maps Inspired Functional Map -->
<div class="absolute inset-0 z-0 map-bg">
<!-- Simulated Google Map elements -->
<div class="absolute inset-0 map-water opacity-80"></div>
<!-- Land mass shape representation -->
<div class="absolute inset-0 map-land" style="clip-path: polygon(15% 0%, 50% 0%, 75% 20%, 85% 45%, 75% 70%, 55% 90%, 25% 85%, 10% 60%, 15% 30%);"></div>
<!-- Park areas -->
<div class="absolute top-[25%] left-[25%] w-32 h-24 map-park rounded-full blur-2xl opacity-60"></div>
<div class="absolute bottom-[20%] left-[30%] w-48 h-32 map-park rounded-full blur-3xl opacity-50"></div>
<!-- Simulated Roads -->
<div class="absolute top-[40%] left-0 w-full h-1.5 map-road -rotate-12"></div>
<div class="absolute top-0 left-[45%] w-1.5 h-full map-road rotate-6"></div>
<div class="absolute top-[55%] left-[30%] w-[50%] h-1 map-road rotate-45"></div>
<!-- Custom Markers Repositioned -->
<!-- Llachón -->
<div class="absolute top-[48%] left-[62%] -translate-x-1/2 -translate-y-1/2 group z-10">
<div class="relative flex flex-col items-center">
<div class="bg-primary text-white p-2 rounded-full shadow-lg marker-pulse cursor-pointer border-2 border-white">
<span class="material-symbols-outlined text-sm" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<span class="mt-1 px-2 py-0.5 bg-white text-primary rounded shadow-sm font-label-md text-[10px] border border-outline-variant/30">Llachón</span>
</div>
</div>
<!-- Ccotos -->
<div class="absolute top-[32%] left-[45%] -translate-x-1/2 -translate-y-1/2 group z-10">
<div class="relative flex flex-col items-center">
<div class="bg-secondary text-white p-2 rounded-full shadow-lg cursor-pointer border-2 border-white">
<span class="material-symbols-outlined text-sm" data-icon="groups" style="font-variation-settings: 'FILL' 1;">groups</span>
</div>
<span class="mt-1 px-2 py-0.5 bg-white text-primary rounded shadow-sm font-label-md text-[10px] border border-outline-variant/30">Ccotos</span>
</div>
</div>
<!-- Chifrón (Selected State) -->
<div class="absolute top-[62%] left-[38%] -translate-x-1/2 -translate-y-1/2 group z-20">
<div class="relative flex flex-col items-center scale-125">
<div class="bg-tertiary text-white p-2 rounded-full shadow-xl cursor-pointer ring-4 ring-tertiary-fixed border-2 border-white">
<span class="material-symbols-outlined text-sm" data-icon="hotel" style="font-variation-settings: 'FILL' 1;">hotel</span>
</div>
<span class="mt-1 px-2 py-0.5 bg-tertiary text-white rounded shadow-md font-label-md text-[10px]">Chifrón</span>
</div>
</div>
<!-- Viewpoint -->
<div class="absolute top-[22%] left-[75%] -translate-x-1/2 -translate-y-1/2 group">
<div class="relative flex flex-col items-center">
<div class="bg-white text-primary p-1.5 rounded-full shadow-sm cursor-pointer border border-outline-variant/50">
<span class="material-symbols-outlined text-xs" data-icon="visibility">visibility</span>
</div>
</div>
</div>
</div>
<!-- Top Controls: Filter Chips -->
<div class="absolute top-4 left-0 w-full z-20">
<div class="flex gap-3 px-container-padding overflow-x-auto custom-scrollbar">
<button class="flex-shrink-0 flex items-center gap-2 px-4 py-2 rounded-full bg-secondary text-white shadow-md transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px]" data-icon="filter_list">filter_list</span>
<span class="font-label-md">Todos</span>
</button>
<button class="flex-shrink-0 flex items-center gap-2 px-4 py-2 rounded-full bg-white/90 backdrop-blur-md border border-outline/10 text-on-surface shadow-sm hover:bg-white transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px] text-secondary" data-icon="forest">forest</span>
<span class="font-label-md">Naturaleza</span>
</button>
<button class="flex-shrink-0 flex items-center gap-2 px-4 py-2 rounded-full bg-white/90 backdrop-blur-md border border-outline/10 text-on-surface shadow-sm hover:bg-white transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px] text-tertiary" data-icon="theater_comedy">theater_comedy</span>
<span class="font-label-md">Cultura</span>
</button>
<button class="flex-shrink-0 flex items-center gap-2 px-4 py-2 rounded-full bg-white/90 backdrop-blur-md border border-outline/10 text-on-surface shadow-sm hover:bg-white transition-all active:scale-95">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="hiking">hiking</span>
<span class="font-label-md">Aventura</span>
</button>
</div>
</div>
<!-- Floating Action Button: Locate Me -->
<button class="absolute right-6 bottom-56 z-20 w-14 h-14 bg-white rounded-2xl shadow-xl flex items-center justify-center text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
</button>
<!-- Bottom Preview Card (Selected Location) -->
<div class="absolute bottom-6 left-6 right-6 z-30">
<div class="glass-panel rounded-3xl overflow-hidden shadow-2xl p-4 flex gap-4 transform transition-all duration-300">
<div class="w-32 h-32 rounded-2xl overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A cozy and authentic Andean family homestay room" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCixChBsIK_7agFCBSOZRrJw9uDVFyMT09yhowQhIzLIHYwGyCW9v4H9gkwNu69QwVmzF-LHplmQ2NAkACI9JAVV6PUkny4VJ21UmN5LBWq5XeXhLU9Eul47hr8nmOVhnMzY-zxBDdI8VVDlDsVRZifr4HPGhK5jWSR6TD5zuPq23EQ546WOINT5Sa7RB2rRtCt1Ofs-3CulCeXBFOGSwII8sREUb1nDujJnH2zNFV_A-mq-T1NeBpDi3qNbQ8nS1GR_cfp-41ko_o"/>
</div>
<div class="flex-grow flex flex-col justify-between py-1">
<div>
<div class="flex justify-between items-start">
<h3 class="font-headline-md text-primary leading-tight">Hospedaje Familiar Samary</h3>
<div class="flex items-center gap-1 bg-secondary-container/20 px-2 py-0.5 rounded-full">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-md text-secondary">4.9</span>
</div>
</div>
<p class="font-body-md text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-base" data-icon="location_on">location_on</span>
                            Playa Chifrón, Capachica
                        </p>
<div class="flex gap-2 mt-2">
<span class="px-2 py-0.5 bg-primary/5 text-primary-container border border-primary/10 rounded-lg text-[10px] font-label-md">Cultura Viva</span>
</div>
</div>
<button class="w-full mt-3 h-12 bg-primary text-on-primary rounded-xl font-label-md flex items-center justify-center gap-2 shadow-lg active:scale-95">
                        Ver detalles
                        <span class="material-symbols-outlined text-base" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-surface-container-lowest/90 backdrop-blur-2xl border-t border-secondary/10 shadow-[0_-10px_30px_rgba(0,66,104,0.05)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 px-4 py-1.5 hover:text-primary transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Inicio</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1.5 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="map" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-label-sm text-label-sm">Mapa</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 px-4 py-1.5 hover:text-primary transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
<span class="font-label-sm text-label-sm">Killa AI</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 px-4 py-1.5 hover:text-primary transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-label-sm text-label-sm">Experiencias</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant/70 px-4 py-1.5 hover:text-primary transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Perfil</span>
</a>
</nav>
<script>
        // Micro-interactions for the map markers
        document.querySelectorAll('.group').forEach(marker => {
            marker.addEventListener('click', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(10);
                document.querySelectorAll('.group .scale-125').forEach(m => m.classList.remove('scale-125', 'ring-4', 'ring-tertiary-fixed'));
                marker.querySelector('div').classList.add('scale-125', 'transition-transform');
            });
        });

        // Filter chips interaction
        const chips = document.querySelectorAll('.flex-shrink-0');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-secondary', 'text-white', 'shadow-md');
                    c.classList.add('bg-white/90', 'text-on-surface', 'border', 'border-outline/10');
                });
                chip.classList.remove('bg-white/90', 'text-on-surface', 'border', 'border-outline/10');
                chip.classList.add('bg-secondary', 'text-white', 'shadow-md');
            });
        });
    </script>
</body></html>
