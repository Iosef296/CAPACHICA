name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies (skip native build scripts)
        working-directory: 'PROYECTO NUEVO/frontend mejorado'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cap sync android
        working-directory: 'PROYECTO NUEVO/frontend mejorado'
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: 'PROYECTO NUEVO/frontend mejorado/android'
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: 'PROYECTO NUEVO/frontend mejorado/android'
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capachica-turismo-debug
          path: 'PROYECTO NUEVO/frontend mejorado/android/app/build/outputs/apk/debug/app-debug.apk'
          retention-days: 30
