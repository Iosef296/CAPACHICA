<div class="p-6 max-w-7xl mx-auto">
  <div class="flex flex-wrap justify-between items-center mb-8">
    <div>
      <h2 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-[#1abc9c] to-[#f1c40f] drop-shadow-md">
        Restaurantes
      </h2>
      <p class="text-gray-400 mt-2 font-medium">Gestiona el catálogo de establecimientos y sus ubicaciones.</p>
    </div>

    <button *ngIf="puedeCrear" routerLink="/restaurantes/crear"
            class="px-6 py-3 bg-gradient-to-r from-[#1abc9c] to-[#16a085] text-white font-bold rounded-xl shadow-[0_0_15px_rgba(26,188,156,0.4)] hover:shadow-[0_0_25px_rgba(26,188,156,0.6)] transition-all duration-300 flex items-center gap-2 transform hover:-translate-y-1">
      <mat-icon>add_circle</mat-icon> Nuevo Restaurante
    </button>
  </div>

  <!-- Panel de Filtros Glassmorphism -->
  <div class="bg-[#1a1a2e]/60 backdrop-blur-md border border-white/10 shadow-2xl rounded-2xl p-6 mb-8" [formGroup]="filtrosForm">
    <div class="flex items-center gap-2 mb-4">
      <mat-icon class="text-[#f1c40f]">filter_list</mat-icon>
      <h3 class="text-lg font-semibold text-white">Filtros de Búsqueda</h3>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <mat-form-field appearance="fill" class="w-full">
        <mat-label>Tipo de comida</mat-label>
        <mat-select formControlName="tipo_comida" (selectionChange)="aplicarFiltros()">
          <mat-option value="">Todos</mat-option>
          <mat-option value="del_lago">Del lago</mat-option>
          <mat-option value="ancestral">Ancestral</mat-option>
          <mat-option value="productos_locales">Productos locales</mat-option>
          <mat-option value="bebidas">Bebidas</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="w-full">
        <mat-label>Precio mínimo (S/)</mat-label>
        <input matInput type="number" formControlName="precio_min" (change)="aplicarFiltros()">
      </mat-form-field>

      <mat-form-field appearance="fill" class="w-full">
        <mat-label>Precio máximo (S/)</mat-label>
        <input matInput type="number" formControlName="precio_max" (change)="aplicarFiltros()">
      </mat-form-field>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
      <div class="flex items-center gap-2">
        <mat-form-field appearance="fill" class="flex-1 mb-0">
          <mat-label>Radio (km)</mat-label>
          <input matInput type="number" formControlName="radio" (change)="aplicarFiltros()">
        </mat-form-field>
        <button mat-mini-fab color="accent" (click)="obtenerUbicacion()" matTooltip="Usar mi ubicación" class="bg-[#f1c40f] text-gray-900 shadow-[0_0_10px_rgba(241,196,15,0.4)] mb-4">
          <mat-icon>my_location</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Contenedor de Tabla -->
  <div class="bg-[#1a1a2e]/40 backdrop-blur-sm border border-white/5 rounded-2xl overflow-hidden shadow-xl">
    <app-tabla
      [columnas]="columnas"
      [datos]="restaurantes"
      [mostrarAcciones]="puedeEditar"
      (editar)="irAEditar($event)"
      (eliminar)="eliminarRestaurante($event)"
    ></app-tabla>

    <div class="bg-black/20 border-t border-white/5">
      <mat-paginator
        class="bg-transparent text-gray-300"
        [length]="total"
        [pageSize]="limit"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPageChange($event)"
        showFirstLastButtons
      ></mat-paginator>
    </div>
  </div>
</div>
