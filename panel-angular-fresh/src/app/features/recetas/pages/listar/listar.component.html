<div class="p-6 max-w-7xl mx-auto">
  <!-- Encabezado -->
  <div class="flex flex-wrap justify-between items-center mb-8">
    <div>
      <h2 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-[#1abc9c] to-[#f1c40f] drop-shadow-md">
        Recetario
      </h2>
      <p class="text-gray-400 mt-2 font-medium">Gestiona las instrucciones y secretos de cada plato.</p>
    </div>

    <button *ngIf="puedeCrear" routerLink="/recetas/crear"
            class="px-6 py-3 bg-gradient-to-r from-[#1abc9c] to-[#16a085] text-white font-bold rounded-xl shadow-[0_0_15px_rgba(26,188,156,0.4)] hover:shadow-[0_0_25px_rgba(26,188,156,0.6)] transition-all duration-300 flex items-center gap-2 transform hover:-translate-y-1">
      <mat-icon>add_circle</mat-icon> Nueva Receta
    </button>
  </div>

  <!-- Panel de Filtros Glassmorphism -->
  <div class="bg-[#1a1a2e]/60 backdrop-blur-md border border-white/10 shadow-2xl rounded-2xl p-6 mb-8" [formGroup]="filtrosForm">
    <div class="flex items-center gap-2 mb-4">
      <mat-icon class="text-[#f1c40f]">menu_book</mat-icon>
      <h3 class="text-lg font-semibold text-white">Buscar receta por plato</h3>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <mat-form-field appearance="fill" class="w-full">
        <mat-label>Selecciona un plato</mat-label>
        <mat-select formControlName="plato_id" (selectionChange)="aplicarFiltros()">
          <mat-option value="">-- Elige un plato para ver su receta --</mat-option>
          <mat-option *ngFor="let p of platos" [value]="p.id">{{ p.nombre }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <!-- Mensaje de estado: Sin plato seleccionado -->
  <div *ngIf="!filtrosForm.get('plato_id')?.value" class="bg-black/20 border border-dashed border-white/10 rounded-2xl p-12 text-center animate-fade-in">
    <mat-icon class="text-6xl text-gray-600 mb-4">search</mat-icon>
    <h3 class="text-xl text-gray-400 font-medium">Selecciona un plato arriba para cargar su receta.</h3>
  </div>

  <!-- Contenedor de Tabla Elevado -->
  <div *ngIf="recetas.length > 0" class="bg-[#1a1a2e]/40 backdrop-blur-sm border border-white/5 rounded-2xl overflow-hidden shadow-xl animate-fade-in">
    <app-tabla
      [columnas]="columnas"
      [datos]="recetas"
      [mostrarAcciones]="puedeEditar"
      (editar)="irAEditar($event)"
      (eliminar)="eliminarReceta($event)"
    ></app-tabla>
  </div>

  <!-- Mensaje de estado: El plato no tiene receta -->
  <div *ngIf="filtrosForm.get('plato_id')?.value && recetas.length === 0" class="bg-black/20 border border-dashed border-white/10 rounded-2xl p-12 text-center animate-fade-in">
    <mat-icon class="text-6xl text-gray-600 mb-4">note_add</mat-icon>
    <h3 class="text-xl text-gray-400 font-medium">Este plato aún no tiene una receta registrada.</h3>
    <button *ngIf="puedeCrear" mat-button color="primary" routerLink="/recetas/crear" class="mt-4 text-[#1abc9c]">
      Crear receta ahora
    </button>
  </div>
</div>
