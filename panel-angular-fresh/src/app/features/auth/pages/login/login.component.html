<div class="min-h-screen bg-gradient-to-br from-[#1a1a2e] via-black to-[#0a0a16] flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Elementos decorativos de fondo -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[#1abc9c]/20 rounded-full blur-[100px]"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-[#f1c40f]/10 rounded-full blur-[100px]"></div>

  <div class="bg-[#1a1a2e]/60 backdrop-blur-2xl border border-white/10 rounded-[2rem] p-10 max-w-md w-full shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative z-10 animate-fade-in">

    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto bg-gradient-to-tr from-[#1abc9c] to-blue-600 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(26,188,156,0.4)] mb-4 transform -rotate-6">
        <span class="text-white text-4xl font-bold">🌾</span>
      </div>
      <h2 class="text-3xl font-black text-white tracking-wide">Bienvenido</h2>
      <p class="text-gray-400 mt-2">Ingresa tus credenciales para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field class="w-full mb-2" appearance="fill">
        <mat-label>Correo Electrónico</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">email</mat-icon>
        <input matInput type="email" formControlName="email" placeholder="ejemplo@correo.com">
        <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Email válido requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field class="w-full mb-6" appearance="fill">
        <mat-label>Contraseña</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">lock</mat-icon>
        <input matInput type="password" formControlName="password">
        <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Contraseña requerida
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" class="w-full py-6 bg-gradient-to-r from-[#1abc9c] to-[#16a085] text-white font-bold rounded-xl shadow-[0_0_15px_rgba(26,188,156,0.4)] hover:shadow-[0_0_25px_rgba(26,188,156,0.6)] transition-all duration-300" [disabled]="loginForm.invalid || cargando">
        <mat-icon class="mr-2" *ngIf="!cargando">login</mat-icon>
        <mat-spinner diameter="20" *ngIf="cargando" class="mr-2 inline-block"></mat-spinner>
        {{ cargando ? 'Verificando...' : 'Ingresar al Panel' }}
      </button>
    </form>

    <p class="text-center mt-8 text-gray-400">
      ¿No tienes cuenta?
      <a routerLink="/auth/registro" class="text-[#f1c40f] font-bold hover:text-white transition-colors underline decoration-[#f1c40f]/50 underline-offset-4">Regístrate aquí</a>
    </p>
  </div>
</div>
