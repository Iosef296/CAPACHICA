<div class="min-h-screen bg-gradient-to-br from-[#1a1a2e] via-black to-[#0a0a16] flex items-center justify-center p-4 relative overflow-hidden py-12">

  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-[#1abc9c]/10 rounded-full blur-[120px]"></div>
  <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px]"></div>

  <div class="bg-[#1a1a2e]/60 backdrop-blur-2xl border border-white/10 rounded-[2rem] p-10 max-w-lg w-full shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative z-10 animate-fade-in">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-[#1abc9c] to-[#f1c40f]">Crear Cuenta</h2>
      <p class="text-gray-400 mt-2">Únete a la plataforma administrativa</p>
    </div>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-x-4">

      <mat-form-field class="w-full md:col-span-2" appearance="fill">
        <mat-label>Nombre Completo</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">person</mat-icon>
        <input matInput formControlName="nombre" placeholder="Tu nombre">
        <mat-error *ngIf="registroForm.get('nombre')?.invalid && registroForm.get('nombre')?.touched">
          Nombre requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field class="w-full md:col-span-2" appearance="fill">
        <mat-label>Correo Electrónico</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">email</mat-icon>
        <input matInput type="email" formControlName="email">
      </mat-form-field>

      <mat-form-field class="w-full md:col-span-2" appearance="fill">
        <mat-label>Contraseña</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">lock_outline</mat-icon>
        <input matInput type="password" formControlName="password">
      </mat-form-field>

      <mat-form-field class="w-full" appearance="fill">
        <mat-label>Teléfono</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">phone</mat-icon>
        <input matInput formControlName="telefono">
      </mat-form-field>

      <mat-form-field class="w-full" appearance="fill">
        <mat-label>Tipo de Usuario</mat-label>
        <mat-select formControlName="rol">
          <mat-option value="turista">Turista</mat-option>
          <mat-option value="proveedor">Proveedor de Servicios</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-raised-button color="primary" class="w-full md:col-span-2 mt-4 py-6 bg-gradient-to-r from-[#1abc9c] to-[#16a085] text-white font-bold rounded-xl shadow-[0_0_15px_rgba(26,188,156,0.4)] hover:shadow-[0_0_25px_rgba(26,188,156,0.6)] transition-all duration-300" [disabled]="registroForm.invalid || cargando">
        <mat-spinner diameter="20" *ngIf="cargando" class="mr-2 inline-block"></mat-spinner>
        {{ cargando ? 'Creando cuenta...' : 'Registrarse Ahora' }}
      </button>
    </form>

    <p class="text-center mt-6 text-gray-400">
      ¿Ya tienes una cuenta?
      <a routerLink="/auth/login" class="text-[#1abc9c] font-bold hover:text-white transition-colors">Inicia sesión</a>
    </p>
  </div>
</div>
