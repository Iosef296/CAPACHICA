<div class="p-6 max-w-4xl mx-auto">

  <!-- Banner y Avatar de Perfil -->
  <div class="bg-gradient-to-r from-[#1a1a2e] to-[#0f0f1c] rounded-3xl overflow-hidden shadow-2xl border border-white/10 mb-8 relative">
    <div class="h-32 bg-gradient-to-r from-[#1abc9c]/20 to-[#f1c40f]/20"></div>

    <div class="px-8 pb-8 relative flex flex-col md:flex-row items-center md:items-end gap-6 -mt-16">
      <div class="w-32 h-32 rounded-full border-4 border-[#1a1a2e] bg-gradient-to-tr from-[#1abc9c] to-blue-600 flex items-center justify-center shadow-[0_0_20px_rgba(26,188,156,0.5)]">
        <mat-icon style="font-size: 64px; width: 64px; height: 64px;" class="text-white">person</mat-icon>
      </div>

      <div class="text-center md:text-left flex-1 mb-2">
        <h2 class="text-3xl font-black text-white tracking-wide">{{ form.get('nombre')?.value || 'Usuario' }}</h2>
        <p class="text-[#f1c40f] font-bold uppercase tracking-widest text-sm flex items-center justify-center md:justify-start gap-1">
          <mat-icon size="small" class="text-sm">badge</mat-icon>
          {{ form.get('rol')?.value || 'Cargando...' }}
        </p>
      </div>
    </div>
  </div>

  <!-- Tarjeta de Edición -->
  <div class="bg-[#1a1a2e]/60 backdrop-blur-md border border-white/10 shadow-xl rounded-3xl overflow-hidden relative min-h-[300px]">

    <div class="p-6 border-b border-white/10 flex items-center gap-3">
      <div class="bg-white/5 p-2 rounded-lg"><mat-icon class="text-[#1abc9c]">manage_accounts</mat-icon></div>
      <h3 class="text-xl font-bold text-white">Datos Personales</h3>
    </div>

    <!-- Loader -->
    <div *ngIf="cargando" class="absolute inset-0 flex items-center justify-center bg-[#1a1a2e]/80 backdrop-blur-sm z-10">
      <app-loading></app-loading>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!cargando" class="p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">

        <mat-form-field appearance="fill" class="w-full">
          <mat-label>Nombre Completo</mat-label>
          <input matInput formControlName="nombre">
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full">
          <mat-label>Correo Electrónico (No modificable)</mat-label>
          <mat-icon matPrefix class="text-gray-500 mr-2">lock</mat-icon>
          <input matInput formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full">
          <mat-label>Teléfono de Contacto</mat-label>
          <input matInput formControlName="telefono">
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full">
          <mat-label>Rol en el Sistema</mat-label>
          <mat-icon matPrefix class="text-gray-500 mr-2">verified_user</mat-icon>
          <input matInput formControlName="rol">
        </mat-form-field>

      </div>

      <div class="flex justify-end pt-8 mt-4 border-t border-white/10">
        <button mat-raised-button color="primary" [disabled]="form.invalid || form.pristine"
                class="px-8 py-6 bg-gradient-to-r from-[#1abc9c] to-[#16a085] text-white font-bold rounded-xl shadow-[0_0_15px_rgba(26,188,156,0.4)] disabled:opacity-50 disabled:shadow-none transition-all">
          <mat-icon class="mr-2">save</mat-icon> Actualizar Perfil
        </button>
      </div>
    </form>
  </div>
</div>
