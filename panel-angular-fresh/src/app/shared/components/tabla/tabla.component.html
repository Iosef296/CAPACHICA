<div class="overflow-x-auto w-full">
  <table mat-table [dataSource]="dataSource" matSort class="w-full">

    <ng-container *ngFor="let col of columnas" [matColumnDef]="col.campo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-sm tracking-wider uppercase">{{ col.titulo }}</th>
      <td mat-cell *matCellDef="let item" class="py-4 px-4">{{ item[col.campo] }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef class="text-center">Acciones</th>
      <td mat-cell *matCellDef="let item" class="text-center">
        <button mat-icon-button matTooltip="Editar" class="text-[#1abc9c] hover:bg-[#1abc9c]/20 transition-colors" (click)="editar.emit(item)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Eliminar" class="text-red-400 hover:bg-red-500/20 transition-colors" (click)="eliminar.emit(item)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnasMostrar"></tr>
    <tr mat-row *matRowDef="let row; columns: columnasMostrar;" class="transition-colors hover:bg-white/5"></tr>
  </table>
</div>
