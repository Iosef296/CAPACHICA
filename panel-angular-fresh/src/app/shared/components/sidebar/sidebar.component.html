<mat-sidenav-container class="h-[calc(100vh-4rem)] bg-transparent">
  <mat-sidenav mode="side" opened class="w-72 bg-[#1a1a2e]/60 backdrop-blur-md border-r border-white/10 p-4 shadow-2xl">

    <div class="flex flex-col gap-1 mt-4">
      <p class="text-xs font-bold text-gray-500 uppercase tracking-widest pl-4 mb-3">Navegación Principal</p>

      <a mat-list-item routerLink="/restaurantes" routerLinkActive="active-nav" class="nav-item rounded-xl mb-1 transition-all duration-300">
        <div class="flex items-center w-full">
          <mat-icon class="mr-4 text-gray-400 transition-colors">restaurant</mat-icon>
          <span class="font-medium text-gray-300 tracking-wide transition-colors">Restaurantes</span>
        </div>
      </a>

      <a mat-list-item routerLink="/platos" routerLinkActive="active-nav" class="nav-item rounded-xl mb-1 transition-all duration-300">
        <div class="flex items-center w-full">
          <mat-icon class="mr-4 text-gray-400 transition-colors">lunch_dining</mat-icon>
          <span class="font-medium text-gray-300 tracking-wide transition-colors">Platos</span>
        </div>
      </a>

      <a mat-list-item routerLink="/talleres" routerLinkActive="active-nav" class="nav-item rounded-xl mb-1 transition-all duration-300">
        <div class="flex items-center w-full">
          <mat-icon class="mr-4 text-gray-400 transition-colors">handyman</mat-icon>
          <span class="font-medium text-gray-300 tracking-wide transition-colors">Talleres</span>
        </div>
      </a>

      <a mat-list-item routerLink="/recetas" routerLinkActive="active-nav" class="nav-item rounded-xl mb-1 transition-all duration-300">
        <div class="flex items-center w-full">
          <mat-icon class="mr-4 text-gray-400 transition-colors">menu_book</mat-icon>
          <span class="font-medium text-gray-300 tracking-wide transition-colors">Recetas</span>
        </div>
      </a>

      <div class="h-px bg-gradient-to-r from-transparent via-white/20 to-transparent my-4 mx-2"></div>

      <p class="text-xs font-bold text-gray-500 uppercase tracking-widest pl-4 mb-3">Configuración</p>

      <a mat-list-item routerLink="/perfil" routerLinkActive="active-nav" class="nav-item rounded-xl mb-1 transition-all duration-300">
        <div class="flex items-center w-full">
          <mat-icon class="mr-4 text-gray-400 transition-colors">manage_accounts</mat-icon>
          <span class="font-medium text-gray-300 tracking-wide transition-colors">Mi Perfil</span>
        </div>
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="p-8 bg-gradient-to-br from-[#1a1a2e] to-[#121220]">
    <div class="max-w-7xl mx-auto">
      <ng-content></ng-content>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
