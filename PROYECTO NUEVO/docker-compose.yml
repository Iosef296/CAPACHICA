services:
  db:
    image: postgres:16-alpine
    container_name: capachica_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcangelpro4321}
      POSTGRES_DB: ${POSTGRES_DB:-capachica_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Carga el esquema y los datos de ejemplo en el primer arranque
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-capachica_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: capachica_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-arcangelpro4321}@db:5432/${POSTGRES_DB:-capachica_db}
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4321}
      JWT_SECRET: ${JWT_SECRET:-capachica_secret_2026}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: capachica_frontend
    restart: unless-stopped
    ports:
      - "4321:4321"
    depends_on:
      - backend

volumes:
  pgdata:
