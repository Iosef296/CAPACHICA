services:
  # ── Backend principal (API) ──────────────────────────
  - type: web
    name: capachica-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        value: db.wavgraafmumtzjqtlvoe.supabase.co
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        value: postgres
      - key: DB_NAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dqflk4iuc
      - key: CLOUDINARY_API_KEY
        value: "196321237742292"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"

  # ── IA Backend ───────────────────────────────────────
  - type: web
    name: capachica-ia
    runtime: node
    rootDir: IA/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_PHONE
        sync: false

  # ── Frontend Astro SSR ───────────────────────────────
  - type: web
    name: capachica-frontend
    runtime: node
    rootDir: frontend mejorado
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: node dist/server/entry.mjs
    envVars:
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: PUBLIC_IA_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4322
