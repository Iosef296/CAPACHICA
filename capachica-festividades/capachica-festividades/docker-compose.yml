services:
  web:
    build: .
    container_name: capachica-festividades
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3002/api/festivities']
      interval: 30s
      timeout: 10s
      retries: 3