<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundo 3D · Capachica</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#040c08;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;color:#e2f5f0;}

#map{position:fixed;inset:0;width:100vw;height:100vh;}

/* ── Overlays de animación ── */
#stars-canvas{
  position:fixed;inset:0;pointer-events:none;z-index:2;
  opacity:0.75;
}
#water-shimmer{
  position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse 70% 50% at 55% 58%,
    rgba(13,148,136,0.10) 0%,
    rgba(5,42,32,0.05) 50%,
    transparent 72%);
  animation:shimmerPulse 3.5s ease-in-out infinite;
}
@keyframes shimmerPulse{
  0%,100%{opacity:0.5;transform:scale(1);}
  50%{opacity:1;transform:scale(1.04);}
}
/* Viñeta oscura en bordes */
#vignette{
  position:fixed;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,
    transparent 55%, rgba(4,12,8,0.6) 100%);
}

/* ── Loading ── */
#loading{
  position:fixed;inset:0;background:#040c08;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  z-index:100;transition:opacity 0.8s;
}
#loading-logo{
  width:80px;height:80px;border-radius:50%;background:#0d9488;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:900;color:#fff;margin-bottom:24px;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:0.85}}
#loading-bar-bg{width:240px;height:4px;background:#1a3a2a;border-radius:2px;overflow:hidden;}
#loading-bar{height:100%;width:0%;background:#0d9488;transition:width 0.4s;border-radius:2px;}
#loading-text{margin-top:16px;font-size:14px;color:#5eead4;opacity:0.8;}

/* ── Back button ── */
#btn-back{
  position:fixed;top:20px;left:20px;z-index:20;
  background:rgba(7,21,16,0.85);border:1px solid #0d9488;
  color:#5eead4;padding:8px 16px;border-radius:8px;font-size:13px;
  cursor:pointer;backdrop-filter:blur(8px);transition:background 0.2s;
  text-decoration:none;display:inline-block;
}
#btn-back:hover{background:rgba(13,148,136,0.3);}

/* ── Time label ── */
#time-label{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  font-size:13px;color:rgba(94,234,212,0.75);pointer-events:none;
  background:rgba(4,12,8,0.6);padding:4px 14px;border-radius:20px;z-index:20;
}

/* ── Hint ── */
#hint{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:rgba(7,21,16,0.78);border:1px solid rgba(94,234,212,0.18);
  border-radius:10px;padding:9px 20px;font-size:12px;color:#94a3b8;
  pointer-events:none;transition:opacity 1.5s;text-align:center;
  white-space:nowrap;z-index:20;
}
#hint kbd{
  background:rgba(13,148,136,0.25);border-radius:4px;padding:1px 6px;
  font-family:monospace;font-size:11px;color:#5eead4;
}

/* ── POI Markers ── */
.poi-marker{cursor:pointer;position:relative;width:54px;height:54px;display:flex;align-items:center;justify-content:center;z-index:10;}
.poi-ring{
  width:28px;height:28px;border:3px solid #fbbf24;border-radius:50%;
  animation:poiPulse 2.2s ease-in-out infinite;
  box-shadow:0 0 18px rgba(251,191,36,0.65),0 0 5px rgba(251,191,36,1);
}
.poi-ring-outer{
  position:absolute;width:44px;height:44px;border:1px solid rgba(251,191,36,0.25);
  border-radius:50%;animation:poiOuter 2.2s ease-in-out infinite;
}
.poi-dot{
  position:absolute;width:9px;height:9px;background:#fbbf24;border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 10px #fbbf24,0 0 4px #fff;
}
.poi-label{
  position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:11px;color:#5eead4;font-weight:600;
  background:rgba(4,12,8,0.92);padding:2px 10px;border-radius:10px;
  border:1px solid rgba(13,148,136,0.5);pointer-events:none;
  font-family:'Plus Jakarta Sans',sans-serif;
  box-shadow:0 0 8px rgba(13,148,136,0.3);
}
@keyframes poiPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.22);opacity:0.65;}}
@keyframes poiOuter{0%,100%{transform:scale(1);opacity:0.5;}50%{transform:scale(1.15);opacity:0.15;}}

/* ── POI Panel ── */
#poi-panel{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(30px);
  width:min(390px,94vw);
  background:rgba(4,12,8,0.97);
  border:1px solid #0d9488;border-radius:18px;
  backdrop-filter:blur(18px);
  opacity:0;transition:opacity 0.35s,transform 0.35s;
  z-index:30;overflow:hidden;pointer-events:none;
  box-shadow:0 8px 40px rgba(0,0,0,0.8),0 0 0 1px rgba(94,234,212,0.1),0 0 30px rgba(13,148,136,0.15);
}
#poi-panel.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
#poi-header{padding:15px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
#poi-header-text{flex:1;min-width:0;}
#poi-panel h3{font-size:15px;color:#5eead4;font-weight:700;margin:0 0 3px;}
#poi-dist{font-size:11px;color:#0d9488;font-weight:600;letter-spacing:0.02em;}
#poi-close{
  flex-shrink:0;width:26px;height:26px;border-radius:50%;
  background:rgba(13,148,136,0.15);border:1px solid rgba(13,148,136,0.4);
  color:#5eead4;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.2s;padding:0;
}
#poi-close:hover{background:rgba(13,148,136,0.35);}
#poi-desc{font-size:12px;color:#94a3b8;line-height:1.6;padding:0 16px 10px;margin:0;}
#poi-map-wrap{
  width:100%;height:185px;overflow:hidden;position:relative;
  border-top:1px solid rgba(13,148,136,0.25);
  border-bottom:1px solid rgba(13,148,136,0.25);
  background:#061410;
}
#poi-map-placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  font-size:12px;color:#5eead4;pointer-events:none;z-index:0;
}
#poi-map-placeholder span{font-size:28px;}
#poi-map{width:100%;height:100%;border:none;position:relative;z-index:1;display:block;}
#poi-actions{display:flex;gap:8px;padding:12px 14px 14px;}
.poi-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;
  text-decoration:none;cursor:pointer;border:none;
  transition:background 0.2s,transform 0.12s;font-family:inherit;
}
.poi-btn:active{transform:scale(0.96);}
#poi-btn-route{background:#0d9488;color:#fff;}
#poi-btn-route:hover{background:#0f766e;}
#poi-btn-view{background:rgba(13,148,136,0.14);color:#5eead4;border:1px solid rgba(13,148,136,0.38);}
#poi-btn-view:hover{background:rgba(13,148,136,0.28);}

/* ── MapLibre dark overrides ── */
.maplibregl-ctrl-group{
  background:rgba(4,12,8,0.9)!important;
  border:1px solid rgba(13,148,136,0.5)!important;
  border-radius:10px!important;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,0.6)!important;
}
.maplibregl-ctrl-group button{background-color:transparent!important;border-color:rgba(13,148,136,0.3)!important;}
.maplibregl-ctrl-group button:hover{background:rgba(13,148,136,0.2)!important;}
.maplibregl-ctrl-group button+button{border-top:1px solid rgba(13,148,136,0.25)!important;}
.maplibregl-ctrl-compass .maplibregl-ctrl-icon,
.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon,
.maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon{filter:invert(0.8) sepia(1) saturate(3) hue-rotate(140deg);}
.maplibregl-ctrl-attrib{background:rgba(4,12,8,0.72)!important;color:#5eead4!important;font-size:10px!important;border-radius:6px!important;}
.maplibregl-ctrl-attrib a{color:#0d9488!important;}
.maplibregl-ctrl-attrib-button{filter:invert(1)!important;}
</style>
</head>
<body>

<div id="loading">
  <div id="loading-logo">C</div>
  <div id="loading-bar-bg"><div id="loading-bar"></div></div>
  <div id="loading-text">Iniciando mundo...</div>
</div>

<!-- Overlays animados -->
<canvas id="stars-canvas"></canvas>
<div id="water-shimmer"></div>
<div id="vignette"></div>

<a id="btn-back" href="index.html">← Volver</a>
<div id="time-label">☀️ Mediodía</div>

<div id="hint">
  <kbd>Arrastrar</kbd> mover &nbsp;·&nbsp;
  <kbd>Clic derecho</kbd> rotar &nbsp;·&nbsp;
  <kbd>Scroll</kbd> zoom &nbsp;·&nbsp;
  <kbd>📍</kbd> marcadores
</div>

<div id="poi-panel">
  <div id="poi-header">
    <div id="poi-header-text">
      <h3 id="poi-name"></h3>
      <div id="poi-dist"></div>
    </div>
    <button id="poi-close" title="Cerrar">✕</button>
  </div>
  <p id="poi-desc"></p>
  <div id="poi-map-wrap">
    <div id="poi-map-placeholder">
      <span>🗺️</span>
      Cargando mapa...
    </div>
    <iframe id="poi-map" allowfullscreen loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <div id="poi-actions">
    <a id="poi-btn-route" class="poi-btn" href="#" target="_blank" rel="noopener noreferrer">
      🧭 Cómo llegar
    </a>
    <a id="poi-btn-view" class="poi-btn" href="#" target="_blank" rel="noopener noreferrer">
      🗺️ Ver en Maps
    </a>
  </div>
</div>

<div id="map"></div>

<script>
(function(){
'use strict';

var loadBar  = document.getElementById('loading-bar');
var loadWrap = document.getElementById('loading');
var loadText = document.getElementById('loading-text');
function setP(p,msg){loadBar.style.width=p+'%';if(msg)loadText.textContent=msg;}

setP(10,'Iniciando mundo...');

// ─── POIs ─────────────────────────────────────────────────────────────────────
var POIS=[
  {name:'Playa Llachón',      desc:'La playa más hermosa de la península. Aguas turquesa, totora y vistas al Titicaca sin igual.',                       coords:[-15.5850,-69.7744],zoom:15},
  {name:'Mirador del Amaru',  desc:'Panorámica 360° sobre el lago, las islas y la cordillera boliviana. Mejor al amanecer.',                             coords:[-15.6005,-69.8148],zoom:15},
  {name:'Comunidad Capachica',desc:'El corazón de la península. Plaza principal, mercado artesanal y calidez aimara-quechua.',                           coords:[-15.6183,-69.8239],zoom:15},
  {name:'Isla Ticonata',      desc:'Isla sagrada a 2h en bote. Lodge comunitario con hospedaje en familias aimaras.',                                    coords:[-15.5067,-69.7983],zoom:14},
  {name:'Mirador Atardeceres',desc:'Los atardeceres de Capachica son únicos en el mundo. El lago se tiñe de naranja y dorado.',                          coords:[-15.6347,-69.8502],zoom:15},
];

setP(22,'Cargando satélite...');

// ─── Map — satélite con filtro dark teal ──────────────────────────────────────
var map=new maplibregl.Map({
  container:'map',
  style:{
    version:8,
    sources:{
      satellite:{
        type:'raster',
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize:256,maxzoom:19,
        attribution:'© Esri, DigitalGlobe'
      },
      terrain:{
        type:'raster-dem',
        tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        tileSize:256,maxzoom:15,encoding:'terrarium',
        attribution:'© Mapzen, USGS'
      }
    },
    layers:[{
      id:'satellite',type:'raster',source:'satellite',
      paint:{
        // ← Aquí está la magia: convierte el satélite al tono oscuro teal
        'raster-hue-rotate':   162,   // verde → teal
        'raster-saturation':   0.55,  // más saturado
        'raster-brightness-max':0.38, // más oscuro
        'raster-contrast':     0.28,  // más contraste
        'raster-opacity':      1.0
      }
    }]
  },
  center:[-69.8239,-15.6183],
  zoom:10.5,pitch:52,bearing:-15,
  maxPitch:85,antialias:true,
});

map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');

setP(45,'Generando relieve 3D...');

// ─── On load ──────────────────────────────────────────────────────────────────
map.on('load',function(){
  setP(65,'Aplicando terreno...');

  try{ map.setTerrain({source:'terrain',exaggeration:2.1}); }
  catch(e){ console.warn('Terrain:',e); }

  setP(78,'Añadiendo cielo...');

  try{
    map.addLayer({
      id:'sky',type:'sky',
      paint:{
        'sky-type':'atmosphere',
        'sky-atmosphere-sun':[0.0,80.0],
        'sky-atmosphere-sun-intensity':8,
        'sky-atmosphere-color':'rgba(6,25,18,1)',
      }
    });
  }catch(e){ console.warn('Sky:',e); }

  setP(90,'Colocando marcadores...');

  // POI markers
  POIS.forEach(function(poi,i){
    var el=document.createElement('div');
    el.className='poi-marker';
    el.innerHTML=
      '<div class="poi-ring-outer" style="animation-delay:'+(i*0.4)+'s"></div>'+
      '<div class="poi-ring"       style="animation-delay:'+(i*0.3)+'s"></div>'+
      '<div class="poi-dot"></div>'+
      '<div class="poi-label">'+poi.name+'</div>';

    new maplibregl.Marker({element:el,anchor:'center'})
      .setLngLat([poi.coords[1],poi.coords[0]])
      .addTo(map);

    el.addEventListener('click',function(e){
      e.stopPropagation();
      openPoiPanel(i);
      map.flyTo({
        center:[poi.coords[1],poi.coords[0]],
        zoom:poi.zoom,pitch:65,
        bearing:map.getBearing()+12,
        duration:1400,essential:true,
        easing:function(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
      });
    });
  });

  setP(100,'¡Listo!');

  // Fly-in de bienvenida
  setTimeout(function(){
    map.flyTo({
      center:[-69.8239,-15.6183],zoom:13.2,
      pitch:62,bearing:-20,duration:4200,essential:true,
      easing:function(t){return 1-Math.pow(1-t,3);}
    });
  },300);

  // Ocultar pantalla de carga
  setTimeout(function(){
    loadWrap.style.opacity='0';
    setTimeout(function(){loadWrap.style.display='none';},850);
  },500);
});

map.on('error',function(e){ console.warn('Map:',e&&e.error&&e.error.message); });

// ─── Day/Night cycle ──────────────────────────────────────────────────────────
var timeLabel=document.getElementById('time-label');
var DAY=180; // segundos de ciclo
var startT=Date.now();
var TIMES=[
  {th:0.00,label:'🌙 Noche',     hue:195, sat:0.30, brt:0.20, exag:2.4},
  {th:0.22,label:'🌅 Amanecer',  hue:170, sat:0.45, brt:0.30, exag:2.2},
  {th:0.38,label:'☀️ Mediodía',  hue:162, sat:0.55, brt:0.38, exag:2.1},
  {th:0.62,label:'🌇 Atardecer', hue:148, sat:0.50, brt:0.32, exag:2.2},
  {th:0.78,label:'🌙 Noche',     hue:195, sat:0.30, brt:0.20, exag:2.4},
];

function lerp(a,b,t){return a+(b-a)*t;}
function dayNight(){
  var ph=((Date.now()-startT)/1000%DAY)/DAY;
  var t0,t1;
  for(var k=0;k<TIMES.length-1;k++){
    if(ph>=TIMES[k].th&&ph<TIMES[k+1].th){t0=TIMES[k];t1=TIMES[k+1];break;}
  }
  if(!t0)return;
  var f=(ph-t0.th)/(t1.th-t0.th);
  var hue=lerp(t0.hue,t1.hue,f);
  var sat=lerp(t0.sat,t1.sat,f);
  var brt=lerp(t0.brt,t1.brt,f);
  // aplicar al layer del satélite
  if(map.getLayer&&map.getLayer('satellite')){
    map.setPaintProperty('satellite','raster-hue-rotate',hue);
    map.setPaintProperty('satellite','raster-saturation',sat);
    map.setPaintProperty('satellite','raster-brightness-max',brt);
  }
  timeLabel.textContent=t0.label;
}
setInterval(dayNight,1500);

// ─── Stars canvas overlay ──────────────────────────────────────────────────────
(function(){
  var cvs=document.getElementById('stars-canvas');
  var ctx=cvs.getContext('2d');
  var stars=[];
  var W,H;

  function resize(){
    W=cvs.width=window.innerWidth;
    H=cvs.height=window.innerHeight;
  }
  window.addEventListener('resize',resize);resize();

  // Generar estrellas aleatorias
  for(var i=0;i<220;i++){
    stars.push({
      x:Math.random(),y:Math.random()*0.55, // solo mitad superior (cielo)
      r:Math.random()*1.2+0.2,
      a:Math.random(),
      speed:0.4+Math.random()*1.2,
      phase:Math.random()*Math.PI*2
    });
  }

  var t0=Date.now();
  function drawStars(){
    requestAnimationFrame(drawStars);
    ctx.clearRect(0,0,W,H);
    var t=(Date.now()-t0)/1000;
    // Determinar si es de noche (opacidad de estrellas según hora)
    var ph=((Date.now()-startT)/1000%DAY)/DAY;
    var nightness=ph<0.22|ph>0.78?1:
      ph<0.38?1-(ph-0.22)/0.16:
      ph>0.62?(ph-0.62)/0.16:0;
    if(nightness<0.05)return;

    stars.forEach(function(s){
      var flicker=0.5+0.5*Math.sin(t*s.speed+s.phase);
      ctx.globalAlpha=s.a*0.8*flicker*nightness;
      ctx.fillStyle='#e2f5f0';
      ctx.beginPath();
      ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  drawStars();
})();

// ─── POI Panel ────────────────────────────────────────────────────────────────
var poiPanel   =document.getElementById('poi-panel');
var poiNameEl  =document.getElementById('poi-name');
var poiDescEl  =document.getElementById('poi-desc');
var poiDistEl  =document.getElementById('poi-dist');
var poiMapEl   =document.getElementById('poi-map');
var poiBtnRoute=document.getElementById('poi-btn-route');
var poiBtnView =document.getElementById('poi-btn-view');
var activePoi  =-1;

function openPoiPanel(i){
  if(i===activePoi)return;
  activePoi=i;
  var p=POIS[i];
  poiNameEl.textContent=p.name;
  poiDescEl.textContent=p.desc;
  poiDistEl.textContent='📍 Lago Titicaca · Puno, Perú';
  var lat=p.coords[0],lng=p.coords[1],z=p.zoom||15;
  poiMapEl.src='https://maps.google.com/maps?q='+lat+','+lng+'&z='+z+'&output=embed&hl=es';
  poiBtnRoute.href='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng;
  poiBtnView.href ='https://www.google.com/maps?q='+lat+','+lng+'&z='+z;
  poiPanel.classList.add('visible');
}
function closePoiPanel(){activePoi=-1;poiPanel.classList.remove('visible');}

document.getElementById('poi-close').addEventListener('click',closePoiPanel);
map.on('click',closePoiPanel);

// Hint fade
var hintEl=document.getElementById('hint'),hintDone=false;
function fadeHint(){if(hintDone)return;hintDone=true;setTimeout(function(){hintEl.style.opacity='0';},2500);}
map.on('dragstart',fadeHint);map.on('zoomstart',fadeHint);

})();
</script>
</body>
</html>
