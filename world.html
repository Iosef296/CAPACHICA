<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundo 3D · Capachica</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#040c08;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;color:#e2f5f0;}
#map{position:fixed;inset:0;width:100vw;height:100vh;}

/* El filtro CSS que convierte el mapa en dark-teal lo aplicamos por JS en el canvas */

/* ── Overlays ── */
#stars-canvas{position:fixed;inset:0;pointer-events:none;z-index:2;}
/* Pulso de agua sobre el lago */
#water-pulse{
  position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse 60% 42% at 56% 60%,
    rgba(13,148,136,0.18) 0%, rgba(5,42,32,0.08) 55%, transparent 72%);
  animation:wPulse 3.8s ease-in-out infinite;
}
@keyframes wPulse{0%,100%{opacity:.45;transform:scale(1);}50%{opacity:1;transform:scale(1.07);}}
/* Scan-lines: efecto mapa de juego */
#scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:4;mix-blend-mode:overlay;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 3px,rgba(0,0,0,0.18) 3px,rgba(0,0,0,0.18) 4px);
}
/* Viñeta */
#vignette{
  position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse 86% 86% at 50% 50%,
    transparent 50%,rgba(4,12,8,.7) 100%);
}

/* ── Loading ── */
#loading{
  position:fixed;inset:0;background:#040c08;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s;
}
#loading-logo{
  width:80px;height:80px;border-radius:50%;background:#0d9488;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:900;color:#fff;margin-bottom:24px;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);opacity:.85;}}
#loading-bar-bg{width:240px;height:4px;background:#1a3a2a;border-radius:2px;overflow:hidden;}
#loading-bar{height:100%;width:0%;background:#0d9488;transition:width .4s;border-radius:2px;}
#loading-text{margin-top:16px;font-size:14px;color:#5eead4;opacity:.8;}

/* ── Back ── */
#btn-back{
  position:fixed;top:20px;left:20px;z-index:20;
  background:rgba(7,21,16,.88);border:1px solid #0d9488;
  color:#5eead4;padding:8px 16px;border-radius:8px;font-size:13px;
  cursor:pointer;backdrop-filter:blur(8px);text-decoration:none;transition:background .2s;
}
#btn-back:hover{background:rgba(13,148,136,.3);}

/* ── Time label ── */
#time-label{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:20;
  font-size:13px;color:rgba(94,234,212,.82);pointer-events:none;
  background:rgba(4,12,8,.65);padding:4px 14px;border-radius:20px;
}

/* ── Hint ── */
#hint{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;
  background:rgba(7,21,16,.8);border:1px solid rgba(94,234,212,.18);
  border-radius:10px;padding:9px 20px;font-size:12px;color:#94a3b8;
  pointer-events:none;transition:opacity 1.5s;text-align:center;white-space:nowrap;
}
#hint kbd{background:rgba(13,148,136,.25);border-radius:4px;padding:1px 6px;font-family:monospace;font-size:11px;color:#5eead4;}

/* ── POI Markers ── */
.poi-marker{cursor:pointer;position:relative;width:54px;height:54px;display:flex;align-items:center;justify-content:center;z-index:10;}
.poi-outer{position:absolute;width:46px;height:46px;border:1px solid rgba(251,191,36,.2);border-radius:50%;animation:poiO 2.4s ease-in-out infinite;}
.poi-ring{width:26px;height:26px;border:3px solid #fbbf24;border-radius:50%;animation:poiP 2.2s ease-in-out infinite;box-shadow:0 0 18px rgba(251,191,36,.55),0 0 4px rgba(251,191,36,.9);}
.poi-dot{position:absolute;width:9px;height:9px;background:#fbbf24;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px #fbbf24;}
.poi-label{
  position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:11px;color:#5eead4;font-weight:600;
  background:rgba(4,12,8,.94);padding:2px 10px;border-radius:10px;
  border:1px solid rgba(13,148,136,.5);pointer-events:none;
  box-shadow:0 0 10px rgba(13,148,136,.3);font-family:'Plus Jakarta Sans',sans-serif;
}
@keyframes poiP{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.25);opacity:.55;}}
@keyframes poiO{0%,100%{transform:scale(1);opacity:.4;}50%{transform:scale(1.2);opacity:.1;}}

/* ── POI Panel ── */
#poi-panel{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(30px);
  width:min(390px,94vw);background:rgba(4,12,8,.97);
  border:1px solid #0d9488;border-radius:18px;backdrop-filter:blur(18px);
  opacity:0;transition:opacity .35s,transform .35s;z-index:30;overflow:hidden;pointer-events:none;
  box-shadow:0 8px 40px rgba(0,0,0,.8),0 0 0 1px rgba(94,234,212,.1),0 0 28px rgba(13,148,136,.14);
}
#poi-panel.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
#poi-header{padding:15px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
#poi-header-text{flex:1;min-width:0;}
#poi-panel h3{font-size:15px;color:#5eead4;font-weight:700;margin:0 0 3px;}
#poi-dist{font-size:11px;color:#0d9488;font-weight:600;}
#poi-close{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:rgba(13,148,136,.15);border:1px solid rgba(13,148,136,.4);color:#5eead4;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;padding:0;}
#poi-close:hover{background:rgba(13,148,136,.35);}
#poi-desc{font-size:12px;color:#94a3b8;line-height:1.6;padding:0 16px 10px;margin:0;}
#poi-map-wrap{width:100%;height:185px;overflow:hidden;position:relative;border-top:1px solid rgba(13,148,136,.25);border-bottom:1px solid rgba(13,148,136,.25);background:#061410;}
#poi-map-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#5eead4;pointer-events:none;z-index:0;}
#poi-map-placeholder span{font-size:28px;}
#poi-map{width:100%;height:100%;border:none;position:relative;z-index:1;display:block;}
#poi-actions{display:flex;gap:8px;padding:12px 14px 14px;}
.poi-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:background .2s,transform .12s;font-family:inherit;}
.poi-btn:active{transform:scale(.96);}
#poi-btn-route{background:#0d9488;color:#fff;}
#poi-btn-route:hover{background:#0f766e;}
#poi-btn-view{background:rgba(13,148,136,.14);color:#5eead4;border:1px solid rgba(13,148,136,.38);}
#poi-btn-view:hover{background:rgba(13,148,136,.28);}

/* MapLibre UI dark */
.maplibregl-ctrl-group{background:rgba(4,12,8,.9)!important;border:1px solid rgba(13,148,136,.5)!important;border-radius:10px!important;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.6)!important;}
.maplibregl-ctrl-group button{background-color:transparent!important;border-color:rgba(13,148,136,.3)!important;}
.maplibregl-ctrl-group button:hover{background:rgba(13,148,136,.2)!important;}
.maplibregl-ctrl-group button+button{border-top:1px solid rgba(13,148,136,.25)!important;}
.maplibregl-ctrl-compass .maplibregl-ctrl-icon,
.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon,
.maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon{filter:invert(.8) sepia(1) saturate(3) hue-rotate(140deg);}
.maplibregl-ctrl-attrib{background:rgba(4,12,8,.75)!important;color:#5eead4!important;font-size:10px!important;border-radius:6px!important;}
.maplibregl-ctrl-attrib a{color:#0d9488!important;}
.maplibregl-ctrl-attrib-button{filter:invert(1)!important;}
</style>
</head>
<body>

<div id="loading">
  <div id="loading-logo">C</div>
  <div id="loading-bar-bg"><div id="loading-bar"></div></div>
  <div id="loading-text">Cargando mundo...</div>
</div>

<canvas id="stars-canvas"></canvas>
<div id="water-pulse"></div>
<div id="scanlines"></div>
<div id="vignette"></div>

<a id="btn-back" href="index.html">← Volver</a>
<div id="time-label">☀️ Mediodía</div>
<div id="hint">
  <kbd>Arrastrar</kbd> mover &nbsp;·&nbsp; <kbd>Clic derecho</kbd> rotar &nbsp;·&nbsp;
  <kbd>Scroll</kbd> zoom &nbsp;·&nbsp; <kbd>📍</kbd> explorar destinos
</div>

<div id="poi-panel">
  <div id="poi-header">
    <div id="poi-header-text"><h3 id="poi-name"></h3><div id="poi-dist"></div></div>
    <button id="poi-close" title="Cerrar">✕</button>
  </div>
  <p id="poi-desc"></p>
  <div id="poi-map-wrap">
    <div id="poi-map-placeholder"><span>🗺️</span>Cargando mapa...</div>
    <iframe id="poi-map" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <div id="poi-actions">
    <a id="poi-btn-route" class="poi-btn" href="#" target="_blank" rel="noopener">🧭 Cómo llegar</a>
    <a id="poi-btn-view"  class="poi-btn" href="#" target="_blank" rel="noopener">🗺️ Ver en Maps</a>
  </div>
</div>

<div id="map"></div>

<script>
(function(){
'use strict';

// ── Progress ─────────────────────────────────────────────────────────────────
var lb=document.getElementById('loading-bar');
var lw=document.getElementById('loading');
var lt=document.getElementById('loading-text');
function setP(p,m){lb.style.width=p+'%';if(m)lt.textContent=m;}
setP(8,'Iniciando...');

// ── POIs ─────────────────────────────────────────────────────────────────────
var POIS=[
  {name:'Playa Llachón',       desc:'La playa más hermosa de la península. Aguas turquesa, totora y vistas al Titicaca sin igual.',         coords:[-15.5850,-69.7744],zoom:15},
  {name:'Mirador del Amaru',   desc:'Panorámica 360° sobre el lago, las islas y la cordillera boliviana. Mejor al amanecer.',               coords:[-15.6005,-69.8148],zoom:15},
  {name:'Comunidad Capachica', desc:'El corazón de la península. Plaza principal, mercado artesanal y calidez aimara-quechua.',             coords:[-15.6183,-69.8239],zoom:15},
  {name:'Isla Ticonata',       desc:'Isla sagrada a 2h en bote. Lodge comunitario con hospedaje en familias aimaras.',                      coords:[-15.5067,-69.7983],zoom:14},
  {name:'Mirador Atardeceres', desc:'Los atardeceres de Capachica son únicos en el mundo. El lago se tiñe de naranja y dorado.',            coords:[-15.6347,-69.8502],zoom:15},
];

// ── Parámetros de animación día/noche ─────────────────────────────────────────
// sepia(1) + hue-rotate(H) + saturate(S) + brightness(B)
// → convierte el mapa de calles a dark-teal con todas las features visibles
var DAY_PHASES=[
  {th:0.00,label:'🌙 Noche',     H:140,S:2.8,B:0.22,A:1.0},
  {th:0.20,label:'🌅 Amanecer',  H:135,S:2.5,B:0.30,A:0.5},
  {th:0.38,label:'☀️ Mediodía',  H:142,S:3.0,B:0.38,A:0.0},
  {th:0.62,label:'🌇 Atardecer', H:130,S:2.6,B:0.28,A:0.5},
  {th:0.78,label:'🌙 Noche',     H:140,S:2.8,B:0.22,A:1.0},
];
var DAY_MS=180000; // 3 min = ciclo completo
var startT=Date.now();
function lerp(a,b,t){return a+(b-a)*t;}

function getCurrentPhase(){
  var ph=((Date.now()-startT)%DAY_MS)/DAY_MS;
  for(var k=0;k<DAY_PHASES.length-1;k++){
    if(ph>=DAY_PHASES[k].th&&ph<DAY_PHASES[k+1].th){
      var a=DAY_PHASES[k],b=DAY_PHASES[k+1];
      var f=(ph-a.th)/(b.th-a.th);
      return {
        label:a.label,
        H:lerp(a.H,b.H,f),
        S:lerp(a.S,b.S,f),
        B:lerp(a.B,b.B,f),
        A:lerp(a.A,b.A,f), // night-ness 0..1
      };
    }
  }
  return DAY_PHASES[0];
}

// ── Construir el mapa ─────────────────────────────────────────────────────────
setP(20,'Cargando mapa...');

var map=new maplibregl.Map({
  container:'map',
  style:{
    version:8,
    sources:{
      // Mapa de calles Esri: muestra casas, calles, parques, agua, etiquetas
      streets:{
        type:'raster',
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'],
        tileSize:256,maxzoom:18,
        attribution:'© Esri, HERE, Garmin, OpenStreetMap, GIS community'
      },
      // Terreno 3D real (altimetría NASA/USGS)
      terrain:{
        type:'raster-dem',
        tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        tileSize:256,maxzoom:15,encoding:'terrarium',
        attribution:'© Mapzen, USGS'
      }
    },
    layers:[{
      id:'streets',type:'raster',source:'streets',
      paint:{'raster-opacity':1.0}
    }]
  },
  center:[-69.8239,-15.6183],
  zoom:10.5,pitch:52,bearing:-15,
  maxPitch:85,antialias:true,
});

map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');

// ── On load ───────────────────────────────────────────────────────────────────
map.on('load',function(){
  setP(65,'Aplicando terreno 3D...');
  try{map.setTerrain({source:'terrain',exaggeration:2.1});}catch(e){console.warn(e);}

  setP(78,'Añadiendo cielo...');
  try{
    map.addLayer({id:'sky',type:'sky',paint:{
      'sky-type':'atmosphere',
      'sky-atmosphere-sun':[0,78],
      'sky-atmosphere-sun-intensity':6,
      'sky-atmosphere-color':'rgba(4,16,12,1)',
    }});
  }catch(e){console.warn(e);}

  setP(90,'Colocando destinos...');
  POIS.forEach(function(poi,i){
    var el=document.createElement('div');
    el.className='poi-marker';
    el.innerHTML=
      '<div class="poi-outer"  style="animation-delay:'+(i*.4)+'s"></div>'+
      '<div class="poi-ring"   style="animation-delay:'+(i*.3)+'s"></div>'+
      '<div class="poi-dot"></div>'+
      '<div class="poi-label">'+poi.name+'</div>';
    new maplibregl.Marker({element:el,anchor:'center'})
      .setLngLat([poi.coords[1],poi.coords[0]])
      .addTo(map);
    el.addEventListener('click',function(e){
      e.stopPropagation();
      openPoi(i);
      map.flyTo({
        center:[poi.coords[1],poi.coords[0]],zoom:poi.zoom,
        pitch:65,bearing:map.getBearing()+12,
        duration:1400,essential:true,
        easing:function(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
      });
    });
  });

  setP(100,'¡Listo!');

  // ── FILTRO CSS ANIMADO en el canvas del mapa ──────────────────────────────
  // sepia(1) convierte todo a un tono cálido base,
  // luego hue-rotate(~140°) lleva ese tono al rango teal.
  // Resultado: casas, calles, agua → todos visibles en dark-teal animado.
  var canvas=map.getCanvas();
  var tAnim=Date.now();
  var timeLabel=document.getElementById('time-label');

  function animFrame(){
    requestAnimationFrame(animFrame);
    var t=(Date.now()-tAnim)/1000;
    var ph=getCurrentPhase();
    // Oscilación sutil para efecto "mundo vivo"
    var H=ph.H+Math.sin(t*.35)*6;
    var S=ph.S+Math.sin(t*.55)*.15;
    var B=ph.B+Math.sin(t*.65)*.018;
    canvas.style.filter=
      'sepia(1) hue-rotate('+H.toFixed(1)+'deg) saturate('+S.toFixed(2)+') brightness('+B.toFixed(3)+') contrast(1.3)';
    timeLabel.textContent=ph.label;
    // Intensidad del pulso de agua según hora
    document.getElementById('water-pulse').style.opacity=(0.3+ph.A*.6).toFixed(2);
  }
  animFrame();

  // Fly-in de bienvenida
  setTimeout(function(){
    map.flyTo({
      center:[-69.8239,-15.6183],zoom:13.2,pitch:62,bearing:-20,
      duration:4200,essential:true,
      easing:function(t){return 1-Math.pow(1-t,3);}
    });
  },300);

  // Ocultar loading
  setTimeout(function(){
    lw.style.opacity='0';
    setTimeout(function(){lw.style.display='none';},850);
  },500);
});

map.on('error',function(e){console.warn('Map:',e&&e.error&&e.error.message);});
map.on('click',closePoi);

// ── Stars canvas ──────────────────────────────────────────────────────────────
(function(){
  var cvs=document.getElementById('stars-canvas');
  var ctx=cvs.getContext('2d');
  var W,H;
  function resize(){W=cvs.width=window.innerWidth;H=cvs.height=window.innerHeight;}
  window.addEventListener('resize',resize);resize();
  var stars=[];
  for(var i=0;i<280;i++) stars.push({
    x:Math.random(),y:Math.random()*.5,
    r:.15+Math.random()*1.1,a:.3+Math.random()*.7,
    spd:.4+Math.random()*1.1,ph:Math.random()*Math.PI*2
  });
  var t0=Date.now();
  function draw(){
    requestAnimationFrame(draw);
    ctx.clearRect(0,0,W,H);
    var t=(Date.now()-t0)/1000;
    var night=getCurrentPhase().A;
    if(night<.04)return;
    stars.forEach(function(s){
      var flicker=.45+.55*Math.sin(t*s.spd+s.ph);
      ctx.globalAlpha=s.a*.9*flicker*night;
      ctx.fillStyle='#e2f5f0';
      ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  draw();
})();

// ── POI Panel ─────────────────────────────────────────────────────────────────
var panel=document.getElementById('poi-panel');
var pName=document.getElementById('poi-name');
var pDesc=document.getElementById('poi-desc');
var pDist=document.getElementById('poi-dist');
var pMap =document.getElementById('poi-map');
var pRoute=document.getElementById('poi-btn-route');
var pView =document.getElementById('poi-btn-view');
var active=-1;

function openPoi(i){
  if(i===active)return;
  active=i;
  var p=POIS[i];
  pName.textContent=p.name;
  pDesc.textContent=p.desc;
  pDist.textContent='📍 Lago Titicaca · Puno, Perú';
  var lat=p.coords[0],lng=p.coords[1],z=p.zoom||15;
  pMap.src='https://maps.google.com/maps?q='+lat+','+lng+'&z='+z+'&output=embed&hl=es';
  pRoute.href='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng;
  pView.href ='https://www.google.com/maps?q='+lat+','+lng+'&z='+z;
  panel.classList.add('visible');
}
function closePoi(){active=-1;panel.classList.remove('visible');}
document.getElementById('poi-close').addEventListener('click',closePoi);

// ── Hint fade ─────────────────────────────────────────────────────────────────
var hintEl=document.getElementById('hint'),hDone=false;
function fadeHint(){if(hDone)return;hDone=true;setTimeout(function(){hintEl.style.opacity='0';},2500);}
map.on('dragstart',fadeHint);map.on('zoomstart',fadeHint);

})();
</script>
</body>
</html>
