version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: capachica_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       capachica
      POSTGRES_USER:     capachica_user
      POSTGRES_PASSWORD: capachica_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capachica_user -d capachica"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - capachica_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capachica_api
    restart: unless-stopped
    environment:
      PORT:      3001
      DB_HOST:   postgres
      DB_PORT:   5432
      DB_NAME:   capachica
      DB_USER:   capachica_user
      DB_PASS:   capachica_pass_2026
      ADMIN_PASS: capachica2026
      CORS_ORIGIN: http://localhost:4321
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - capachica_net

  frontend:
    build:
      context: ./frontend/astro-app
      dockerfile: Dockerfile
    container_name: capachica_web
    restart: unless-stopped
    environment:
      API_URL:        http://backend:3001
      PUBLIC_API_URL: http://localhost:3001
    ports:
      - "4321:4321"
    depends_on:
      - backend
    networks:
      - capachica_net

volumes:
  postgres_data:

networks:
  capachica_net:
    driver: bridge